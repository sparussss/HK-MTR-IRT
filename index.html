<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="港鐵輕鐵">
  <meta name="description" content="香港港鐵＋輕鐵點對點路線規劃 PWA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>港鐵・輕鐵點對點</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">HONG KONG RAIL PLANNER</div>
      <h1>港鐵・輕鐵點對點</h1>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">安裝</button>
  </header>

  <main class="wrap">
    <section class="card planner-card">
      <div class="field">
        <label for="fromSelect">起點</label>
        <select id="fromSelect"></select>
      </div>

      <button id="swapBtn" class="swap" type="button" aria-label="交換起點終點">⇅</button>

      <div class="field">
        <label for="toSelect">終點</label>
        <select id="toSelect"></select>
      </div>

      <div class="actions">
        <button id="planBtn" class="primary" type="button">搜尋路線</button>
        <button id="clearBtn" class="secondary" type="button">清除</button>
      </div>

      <div class="quick">
        <span>快速測試：</span>
        <button data-from="土瓜灣" data-to="新圍">土瓜灣 → 新圍</button>
        <button data-from="兆康" data-to="新圍">兆康 → 新圍</button>
        <button data-from="屯門" data-to="天逸">屯門 → 天逸</button>
      </div>
    </section>

    <section id="resultSection" class="card result-card hidden">
      <div class="result-head">
        <div>
          <div class="eyebrow">建議路線</div>
          <h2 id="resultTitle"></h2>
        </div>
        <div class="summary">
          <strong id="stopCount">0</strong>
          <span>站／段</span>
        </div>
      </div>
      <div id="routeSteps" class="route-steps"></div>
      <p class="note">此版本以站數＋轉乘次數作路線權重，未計候車時間、步行距離及臨時服務安排。</p>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>最近搜尋</h2>
        <button id="clearHistoryBtn" class="linkbtn" type="button">清除</button>
      </div>
      <div id="historyList" class="history-list empty">未有紀錄</div>
    </section>

    <section class="card info-card">
      <h2>版本資料</h2>
      <p><b>v0.1</b> — 港鐵＋輕鐵點對點、轉乘提示、最近搜尋、PWA 安裝及 app shell 離線快取。</p>
      <p>路綫資料按 2026-09-07 官方港鐵系統圖及輕鐵行車時間表整理；「屯門泳池」已使用 2026-07-05 起的新站名「海皇路」。</p>
      <p class="muted">下一步可加入：實時到站、八達通車費、頭／尾班車、月台／轉乘方向、常用路線收藏。</p>
      <a class="official" href="https://www.mtr.com.hk/ch/customer/jp/index.php" target="_blank" rel="noopener">開啟港鐵官方行程指南 ↗</a>
    </section>
  </main>

  <footer>非港鐵官方產品・資料只供行程參考</footer>
  <script src="./app.js"></script>
</body>
</html>
